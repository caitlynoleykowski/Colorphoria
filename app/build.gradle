apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.oo0o0o.colorphoria"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 6
        versionName "1.1"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//            resValue 'string', 'gcp_project_id', 'filler-ea8ae'
//            resValue 'string', 'gcp_api_key', 'AIzaSyC2F1FVP1yAqkRJomg8hoL1GR614low1AE'
            resValue 'string', 'admob_ad_unit_id_banner_navigation_footer', 'ca-app-pub-7546412369288210/8155530654'
            resValue 'string', 'admob_ad_unit_id_banner_pic_edit', 'ca-app-pub-7546412369288210/5909475416'
            resValue 'string', 'admob_ad_unit_id_interstitial_share', 'ca-app-pub-7546412369288210/2816408211'
        }
        debug {
            debuggable true
//            resValue 'string', 'gcp_project_id', 'filler-ea8ae'
//            resValue 'string', 'gcp_api_key', 'AIzaSyC2F1FVP1yAqkRJomg8hoL1GR614low1AE'
