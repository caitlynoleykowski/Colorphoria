            resValue 'string', 'admob_ad_unit_id_banner_pic_edit', 'ca-app-pub-3940256099942544/6300978111'
            resValue 'string', 'admob_ad_unit_id_interstitial_share', 'ca-app-pub-3940256099942544/8691691433'
        }
//        staging {
//            initWith debug
