dependencies {
    def room_version = "1.1.1"

    compile fileTree(include: ['*.jar'], dir: 'libs')
    // Network call library
    // Firebase login
    // Firebase api to google cloud storage
    // Needed for google login - still going through firebase though
    // Needed for special UI components in login layouts
    compile 'com.android.volley:volley:1.0.0'
    compile 'com.google.firebase:firebase-auth:12.0.1'
    compile 'com.google.firebase:firebase-storage:12.0.1'
    compile 'com.google.android.gms:play-services-auth:12.0.1'
    compile 'com.android.support:appcompat-v7:27.1.0'
    compile 'com.android.support:design:27.1.0'
    compile 'com.loopj.android:android-async-http:1.4.9'

    implementation 'com.google.firebase:firebase-ads:12.0.1'
    implementation 'com.google.firebase:firebase-core:12.0.1'

    implementation "android.arch.persistence.room:runtime:$room_version"
    annotationProcessor "android.arch.persistence.room:compiler:$room_version"

    // test dependencies
    testCompile 'junit:junit:4.12'
    testCompile 'org.robolectric:robolectric:2.4'
}

apply plugin: 'com.google.gms.google-services'